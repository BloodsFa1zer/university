# BankMonitor stack. Only the gateway publishes a port on the host (rule R7);
# extra ports for debugging live in docker-compose.dev.yml.
name: bankmon

services:
  postgres:
    image: postgres:17.11
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=200
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=500ms
      - -c
      - track_io_timing=on
      - -c
      - "log_line_prefix=%m [%p] %u@%d "
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Read by db/init/03-roles.sh on first start.
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      MONITOR_DB_USER: ${MONITOR_DB_USER:?}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP on purpose: while the init scripts run, the temporary server listens only
      # on the unix socket, so a socket check would report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.7-management
    # A fixed hostname gives a fixed node name (rabbit@rabbitmq); otherwise a recreated
    # container would not find its own data in the volume.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  worker:
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    environment:
      SERVICE_NAME: worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 15s
    restart: unless-stopped

  generator:
    build:
      context: ./services
      dockerfile: generator/Dockerfile
    environment:
      SERVICE_NAME: generator
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONITOR_DATABASE_URL: postgresql://${MONITOR_DB_USER}:${MONITOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      GEN_RATE: ${GEN_RATE:-20}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    stop_grace_period: 15s
    restart: unless-stopped

  auth:
    build:
      context: ./services
      dockerfile: auth/Dockerfile
    environment:
      SERVICE_NAME: auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      LOG_LEVEL: info
      AUTH_DB_PATH: /data/auth.db
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      AUTH_TOKEN_TTL_S: ${AUTH_TOKEN_TTL_S:-3600}
      AUTH_ADMIN_USER: ${AUTH_ADMIN_USER:?}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?}
      AUTH_VIEWER_USER: ${AUTH_VIEWER_USER:?}
      AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD:?}
    volumes:
      - auth_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
    environment:
      # The monitoring role: pg_monitor plus SELECT on accounts, nothing else.
      DATA_SOURCE_NAME: postgresql://${MONITOR_DB_USER}:${MONITOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
      start_interval: 1s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    # Our own command replaces the image's default flags, so all of them are listed.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # Served by the gateway under /prometheus/; inside the network the API stays at /.
      - --web.external-url=http://localhost:${GATEWAY_PORT:-8080}/prometheus/
      - --web.route-prefix=/
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

  # No healthcheck: the image has no shell or HTTP client (G2); the tests poll /ready.
  loki:
    image: grafana/loki:3.6.20
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  # Reads the logs of the project's containers through the Docker socket (read-only)
  # and pushes them to Loki. The image runs as root, which the socket needs (G6).
  # No healthcheck: the image has no HTTP client (G2).
  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  # No healthcheck: the image has no shell or HTTP client (G2); the tests poll /ready.
  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      # Served by the gateway under /grafana/.
      GF_SERVER_ROOT_URL: http://localhost:${GATEWAY_PORT:-8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Who the user is comes only from the gateway (auth proxy); the role is synced
      # from X-WEBAUTH-ROLE on every request.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_SYNC_TTL: "0"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: /auth/logout
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Internal administrator: used by provisioning and by the tests inside the network.
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/grafana/api/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped

  # One-shot: makes bank-overview the home dashboard of the organisation. Grafana has
  # no provisioning for preferences, and default_home_dashboard_path in Grafana 13
  # serves a separate copy that viewers are not allowed to open.
  grafana-init:
    image: grafana/grafana:13.2.6
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        api=http://grafana:3000/grafana/api
        auth="$$GF_SECURITY_ADMIN_USER:$$GF_SECURITY_ADMIN_PASSWORD"
        for attempt in $$(seq 1 60); do
          if curl -sf -u "$$auth" "$$api/dashboards/uid/bank-overview" > /dev/null &&
             curl -sf -u "$$auth" -X PUT -H "Content-Type: application/json" \
               -d '{"homeDashboardUID": "bank-overview"}' "$$api/org/preferences"; then
            echo; echo "home dashboard set to bank-overview"; exit 0
          fi
          sleep 2
        done
        echo "could not set the home dashboard" >&2; exit 1
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?}
    depends_on:
      grafana:
        condition: service_healthy
    restart: "no"

  # The only service with a port on the host (rule R7).
  gateway:
    image: nginx:1.30.6-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      generator:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
      # A one-shot container: `up --wait` accepts its exit only through such a dependency (G17).
      grafana-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 20s
      start_interval: 1s
    restart: unless-stopped

  # Test runner: lint, unit and e2e tests run here, the code comes in via the volume.
  # Started only on demand: make lint / make unit / make e2e.
  # It must not depend on the worker: the outage tests run while the worker is stopped.
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["test"]
    env_file: .env
    environment:
      PYTHONPATH: /repo/services/common:/repo/services/worker:/repo/services/generator:/repo/services/auth:/repo
      PYTHONDONTWRITEBYTECODE: "1"
      PG_ADMIN_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PG_APP_DSN: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PG_MONITOR_DSN: postgresql://${MONITOR_DB_USER}:${MONITOR_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      RABBITMQ_API: http://rabbitmq:15672
      WORKER_URL: http://worker:8000
      GENERATOR_URL: http://generator:8000
      GATEWAY_URL: http://gateway:8080
      AUTH_URL: http://auth:8000
      PROM_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000/grafana
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
    volumes:
      - .:/repo:ro
      # Shared by the phases of the worker outage test (make outage-test).
      - tests_state:/state
    working_dir: /repo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pg_data:
  rabbitmq_data:
  auth_data:
  prom_data:
  grafana_data:
  loki_data:
  tempo_data:
  tests_state:
