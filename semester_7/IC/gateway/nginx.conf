# Gateway: the only entry point of BankMonitor (docs/00-common.md §6.2).
#
# Every protected request is first checked by the auth service (auth_request): only a
# 2xx answer lets it through, and the user name and role passed on to the service are
# taken from that answer — whatever the client sent in those headers is dropped.

user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    # Redirects keep the client's host and port: "Location: /auth/login?…".
    absolute_redirect off;

    # Docker's DNS. Upstreams are resolved per request (see the variables below), so
    # nginx starts while a service is still down and finds containers that got a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ISO 8601 time with milliseconds, built from $time_iso8601 and $msec.
    map $time_iso8601 $log_time {
        "~^(?<seconds>[^+Z]+)(?<zone>.*)$" $seconds;
    }
    map $msec $log_millis {
        "~\.(?<millis>\d+)$" $millis;
    }
    log_format json escape=json
        '{"ts":"${log_time}.${log_millis}Z","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"request_time":$request_time,"user":"$auth_user"}';
    access_log /dev/stdout json;

    # WebSocket upgrade for Grafana Live (G11).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8080;

        set $auth_upstream http://auth:8000;
        set $generator_upstream http://generator:8000;
        set $prometheus_upstream http://prometheus:9090;
        set $grafana_upstream http://grafana:3000;

        # Sent to every upstream. An empty value means the header is not sent at all,
        # so a client cannot smuggle its own X-Auth-User past the gateway.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Role $auth_role;

        # --- the auth subrequests (G12) -----------------------------------------
        # No body, always GET (the verify route only answers GET), cookies and the
        # Authorization header of the original request go along.
        location = /_auth/any {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_pass $auth_upstream/auth/verify;
        }
        location = /_auth/admin {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_pass $auth_upstream/auth/verify?require=admin;
        }

        # What to answer when auth says 401: pages go to the login form,
        # API calls get JSON.
        location @login {
            return 302 /auth/login?rd=$request_uri;
        }
        location @api_unauthorized {
            default_type application/json;
            return 401 '{"detail":"Not authenticated"}';
        }

        # --- public -------------------------------------------------------------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = / {
            return 302 /grafana/;
        }
        location = /auth/login {
            proxy_pass $auth_upstream;
        }
        location = /auth/logout {
            proxy_pass $auth_upstream;
        }
        location = /auth/token {
            proxy_pass $auth_upstream;
        }
        location = /auth/me {
            proxy_pass $auth_upstream;
        }

        # --- admin only ---------------------------------------------------------
        location /control/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            error_page 401 = @login;
            proxy_pass $generator_upstream;
        }
        location /control/api/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            error_page 401 = @api_unauthorized;
            proxy_pass $generator_upstream;
        }

        # Prometheus UI and API, prefix stripped (Prometheus serves itself at "/" and
        # builds its links from --web.external-url, which ends in /prometheus/).
        location = /prometheus {
            return 302 /prometheus/;
        }
        location /prometheus/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            error_page 401 = @login;
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass $prometheus_upstream;
        }
        location /prometheus/api/ {
            auth_request /_auth/admin;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_role $upstream_http_x_auth_role;
            error_page 401 = @api_unauthorized;
            rewrite ^/prometheus/(.*)$ /$1 break;
            proxy_pass $prometheus_upstream;
        }

        # Grafana for every signed-in user. The user and the Grafana role go in the
        # auth proxy headers; Authorization is dropped, so nobody can use Grafana's
        # internal administrator through the gateway. These locations set their own
        # proxy headers, so the server-level ones are not inherited and are repeated.
        location /grafana/ {
            auth_request /_auth/any;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_grafana_role $upstream_http_x_auth_grafana_role;
            error_page 401 = @login;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User "";
            proxy_set_header X-Auth-Role "";
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $auth_grafana_role;
            proxy_set_header Authorization "";
            proxy_pass $grafana_upstream;
        }
        location /grafana/api/live/ {
            auth_request /_auth/any;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_grafana_role $upstream_http_x_auth_grafana_role;
            error_page 401 = @login;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User "";
            proxy_set_header X-Auth-Role "";
            proxy_set_header X-WEBAUTH-USER $auth_user;
            proxy_set_header X-WEBAUTH-ROLE $auth_grafana_role;
            proxy_set_header Authorization "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_pass $grafana_upstream;
        }

        # Everything else — /auth/verify, /metrics and /healthz of the services — is
        # not reachable from outside.
        location / {
            return 404;
        }
    }
}
