<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід до BankMonitor</title>
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --text: #1c2230; --muted: #5d6878;
          --border: #d9dee6; --accent: #2457d6; --danger: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #13161b; --card: #1c2027; --text: #e5e8ed; --muted: #9ba5b3;
            --border: #2d333d; --accent: #78a6ff; --danger: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border);
         border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 0; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 8px 10px; color: var(--text); background: var(--card);
          border: 1px solid var(--border); border-radius: 6px; }
  button { font: inherit; cursor: pointer; padding: 9px 14px; border-radius: 6px; color: #fff;
           background: var(--accent); border: 1px solid var(--accent); }
  .error { color: var(--danger); margin: 0; }
</style>
</head>
<body>
<form method="post" action="/auth/login">
  <h1>Вхід до BankMonitor</h1>
  {{error}}
  <label>Логін <input name="username" autocomplete="username" required value="{{username}}"></label>
  <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
  <input type="hidden" name="rd" value="{{rd}}">
  <button type="submit">Увійти</button>
</form>
</body>
</html>
