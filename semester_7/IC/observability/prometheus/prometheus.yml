# Prometheus of BankMonitor (docs/00-common.md §6.9). Checked with `promtool check config`.
global:
  scrape_interval: 5s
  # Must not exceed the interval, otherwise Prometheus refuses the configuration.
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # /metrics/per-object keeps the `queue` label; plain /metrics sums all queues (G7).
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: generator
    static_configs:
      - targets: ["generator:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:8000"]

  - job_name: auth
    static_configs:
      - targets: ["auth:8000"]

  # With serve_from_sub_path Grafana serves its metrics under the sub path too.
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
