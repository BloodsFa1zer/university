# Dashboards as code: every JSON file in /etc/grafana/dashboards appears in the
# "BankMonitor" folder and cannot be changed or deleted from the UI.
apiVersion: 1

providers:
  - name: bankmonitor
    orgId: 1
    folder: BankMonitor
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
